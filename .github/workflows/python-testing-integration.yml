name: Python Testing Integration

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.rst'
  push:
    branches:
      - main  
    paths-ignore:
      - '**.md'
      - '**.rst'

# For testing the workflow.
# on:
