name: Python Testing Integration Template

on:
  workflow_call:

jobs:
  test-all:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - name: Checkout calling repository (PR version)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # 1. Always install ToolVIPER
      - name: Clone and install ToolVIPER (main)
        if: github.repository != '${{ github.repository_owner }}/ToolVIPER'
        run: |
          git clone https://github.com/${{ github.repository_owner }}/ToolVIPER.git
          pip install -e ToolVIPER

      # 2. XRADIO
      - name: Clone and install XRADIO (main)
        if: github.repository != '${{ github.repository_owner }}/XRADIO'
        run: |
          git clone https://github.com/${{ github.repository_owner }}/XRADIO.git
          pip install -e XRADIO

      # 3. GraphVIPER
      - name: Clone and install GraphVIPER (main)
        if: github.repository != '${{ github.repository_owner }}/GraphVIPER'
        run: |
          git clone https://github.com/${{ github.repository_owner }}/GraphVIPER.git
          pip install -e GraphVIPER

      # 4. AstroVIPER
      - name: Clone and install AstroVIPER (main)
        if: github.repository != '${{ github.repository_owner }}/AstroVIPER'
        run: |
          git clone https://github.com/${{ github.repository_owner }}/AstroVIPER.git
          pip install -e AstroVIPER

      # 5. Run tests
      - name: Run ToolVIPER tests
        run: |
          if [ "${{ github.repository }}" = "${{ github.repository_owner }}/ToolVIPER" ]; then
            pytest tests
          else
            pytest ToolVIPER/tests
          fi

      - name: Run XRADIO tests
        run: |
          if [ "${{ github.repository }}" = "${{ github.repository_owner }}/XRADIO" ]; then
            pytest tests
          else
            pytest XRADIO/tests
          fi

      - name: Run GraphVIPER tests
        run: |
          if [ "${{ github.repository }}" = "${{ github.repository_owner }}/GraphVIPER" ]; then
            pytest tests
          else
            pytest GraphVIPER/tests
          fi

      - name: Run AstroVIPER tests
        run: |
          if [ "${{ github.repository }}" = "${{ github.repository_owner }}/AstroVIPER" ]; then
            pytest tests
          else
            pytest AstroVIPER/tests
          fi

