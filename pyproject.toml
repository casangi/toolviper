]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">= 3.11, < 3.14"

dependencies = [
    'cerberus',
    'dask>=2026.3.0',
    'dask_jobqueue',
    'distributed>=2026.3.0',
    'numpy',
    'psutil',
    'rich',
    'pandas',
    'graphviper',
    'itables',
    'requests',
